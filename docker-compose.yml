services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DOMAIN=${DOMAIN:-localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - BACKEND_URL=${BACKEND_URL:-http://localhost/api}
      - JWT_SECRET=${JWT_SECRET:-change_me_generate_with_openssl_rand_base64}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-sekolah}
      - DB_PASSWORD=${DB_PASSWORD:-sekolah_password}
      - DB_NAME=${DB_NAME:-sekolah_modern}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sekolah-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sekolah-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      - MYSQL_DATABASE=${DB_NAME:-sekolah_modern}
      - MYSQL_USER=${DB_USER:-sekolah}
      - MYSQL_PASSWORD=${DB_PASSWORD:-sekolah_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sekolah-network

networks:
  sekolah-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
